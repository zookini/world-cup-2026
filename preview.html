<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Cup 2026 — Tsubasa Theme Preview</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="themes/tsubasa.css" />
  </head>
  <body>
    <main class="arena">
      <header class="marquee">
        <h1>World Cup 2026</h1>
      </header>

      <nav class="view-tabs" aria-label="Views">
        <button class="active" type="button" data-view="standings">Standings</button>
        <button type="button" data-view="fixtures">Fixtures</button>
        <button type="button" data-view="groups">Groups</button>
        <button type="button" data-view="knockouts">Knockouts</button>
      </nav>

      <section class="view-panel money-board active" data-panel="standings" aria-label="Pool standings">
        <div id="contenders" class="contender-table"></div>
      </section>

      <section class="view-panel fixtures-board" data-panel="fixtures" aria-label="Match fixtures">
        <div id="fixtures" class="fixture-list"></div>
      </section>

      <section class="view-panel world-board" data-panel="groups" aria-label="Group standings">
        <div id="groups" class="group-stage"></div>
      </section>

      <section class="view-panel knockout-board" data-panel="knockouts" aria-label="Knockout stage">
        <div id="knockouts" class="knockout-grid"></div>
      </section>

      <p id="sync-status" class="visually-hidden" aria-live="polite"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
