<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Degenerate Cup 2026</title>
    <meta name="theme-color" content="#eaf4ff" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="themes/tsubasa.css" />
  </head>
  <body>
    <main class="arena">
      <header class="marquee">
        <div class="marquee-copy">
          <h1>Degenerate Cup 2026</h1>
        </div>
        <img
          class="marquee-art"
          src="assets/degenerate-title.webp"
          decoding="async"
          alt=""
          aria-hidden="true"
        />
      </header>

      <nav class="view-tabs" aria-label="Views">
        <button class="active" type="button" data-view="standings">Standings</button>
        <button type="button" data-view="losers">Losers</button>
        <button type="button" data-view="fixtures">Fixtures</button>
        <button type="button" data-view="bracket">Bracket</button>
      </nav>

      <section class="view-panel money-board active" data-panel="standings" aria-label="Pool standings">
        <div id="contenders" class="contender-table"></div>
      </section>

      <section id="losers" class="view-panel last-board" data-panel="losers" aria-label="Losers standings">
        <div id="last-place" class="group-table last-place-table"></div>
      </section>

      <section class="view-panel fixtures-board" data-panel="fixtures" aria-label="Match fixtures">
        <div id="fixtures" class="fixture-list"></div>
      </section>

      <section class="view-panel bracket-board" data-panel="bracket" aria-label="Knockout bracket">
        <div id="bracket" class="bracket"></div>
      </section>

      <p id="sync-status" class="sync-status" aria-live="polite"></p>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
