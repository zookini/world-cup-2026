<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive Preview</title>
    <style>
      :root {
        --chrome: #f4f4f4;
        --text: #171717;
        --muted: #666666;
        --line: #d9d9d9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: var(--chrome);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: rgba(244, 244, 244, 0.94);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(10px);
      }

      label {
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 700;
      }

      select {
        min-width: 180px;
        padding: 8px 10px;
        color: var(--text);
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
      }

      .size {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .stage {
        display: grid;
        place-items: start center;
        min-height: calc(100vh - 58px);
        padding: 24px;
        overflow: auto;
      }

      .device {
        width: var(--preview-width);
        height: var(--preview-height);
        max-width: 100%;
        overflow: hidden;
        background: #ffffff;
        border: 1px solid #cfcfcf;
        border-radius: var(--preview-radius);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.15);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <label for="device">Preview</label>
      <select id="device">
        <option value="1440x900x0">Laptop</option>
        <option value="393x852x28" selected>iPhone 15</option>
        <option value="430x932x30">iPhone 15 Max</option>
        <option value="412x915x28">Pixel 8</option>
      </select>
      <span class="size" id="size"></span>
    </div>

    <main class="stage">
      <div class="device" id="frame">
        <iframe src="/" title="World Cup 2026 preview"></iframe>
      </div>
    </main>

    <script>
      const selector = document.querySelector("#device");
      const frame = document.querySelector("#frame");
      const size = document.querySelector("#size");

      function applyDevice() {
        const [width, height, radius] = selector.value.split("x");
        frame.style.setProperty("--preview-width", `${width}px`);
        frame.style.setProperty("--preview-height", `${height}px`);
        frame.style.setProperty("--preview-radius", `${radius}px`);
        size.textContent = `${width} x ${height}`;
      }

      selector.addEventListener("change", applyDevice);
      applyDevice();
    </script>
  </body>
</html>
